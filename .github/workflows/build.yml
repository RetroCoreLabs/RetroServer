name: build
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The documentation checker: broken links, absolute paths, the README template. Fails the
      # build like a failing test.
      - name: Check the documentation
        shell: pwsh
        run: python src/eng/check-docs.py
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      # RetroServer references the RetroIO packages as 0.1.0-local.*, which exist only in a local
      # folder feed. Build them here, into the folder src/nuget.config points at (the parent of
      # the workspace, beside it). RetroIO is public, so the checkout needs no token.
      - name: Check out RetroIO
        uses: actions/checkout@v4
        with:
          repository: RetroCoreLabs/RetroIO
          path: RetroIO

      - name: Pack RetroIO into the local feed
        shell: pwsh
        run: ./RetroIO/src/eng/publish-local.ps1 -Feed "$env:GITHUB_WORKSPACE/../localfeed"

      # The same script a developer runs and the release job runs: build, the tests with the
      # CI category filter, then publish both programs as single files. One way to build, so
      # what CI checks is what gets released (2026-11-24). Warnings are errors already
      # (TreatWarningsAsErrors in src/Directory.Build.props).
      - name: Build, test and publish
        shell: pwsh
        working-directory: src
        run: ./build.ps1

  # The Linux container: build the image (eng/build-docker.ps1) and check that it starts and
  # answers /health (eng/test-docker.ps1). Ubuntu runners have Docker and PowerShell.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - name: Check out RetroIO
        uses: actions/checkout@v4
        with:
          repository: RetroCoreLabs/RetroIO
          path: RetroIO
      - name: Pack RetroIO into the local feed
        shell: pwsh
        run: ./RetroIO/src/eng/publish-local.ps1 -Feed "$env:GITHUB_WORKSPACE/../localfeed"
      - name: Build the image
        shell: pwsh
        working-directory: src
        run: ./eng/build-docker.ps1 -Tag retroserver:ci
      - name: Start the image and wait for /health
        shell: pwsh
        working-directory: src
        run: ./eng/test-docker.ps1 -Tag retroserver:ci
